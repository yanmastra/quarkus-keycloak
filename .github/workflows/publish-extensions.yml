name: Publish Extensions to GitHub Packages

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension to publish (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - quarkus-base
          - quarkus-authentication
          - quarkus-authorization
          - quarkus-microservices-common
          - quarkus-error-mail-notification
          - quarkus-media-file-manager

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      quarkus-base: ${{ steps.result.outputs.quarkus-base }}
      quarkus-authentication: ${{ steps.result.outputs.quarkus-authentication }}
      quarkus-authorization: ${{ steps.result.outputs.quarkus-authorization }}
      quarkus-microservices-common: ${{ steps.result.outputs.quarkus-microservices-common }}
      quarkus-error-mail-notification: ${{ steps.result.outputs.quarkus-error-mail-notification }}
      quarkus-media-file-manager: ${{ steps.result.outputs.quarkus-media-file-manager }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed extensions (push)
        id: changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            quarkus-base:
              - 'extensions/quarkus-base/**'
            quarkus-authentication:
              - 'extensions/quarkus-authentication/**'
            quarkus-authorization:
              - 'extensions/quarkus-authorization/**'
            quarkus-microservices-common:
              - 'extensions/quarkus-microservices-common/**'
            quarkus-error-mail-notification:
              - 'extensions/quarkus-error-mail-notification/**'
            quarkus-media-file-manager:
              - 'extensions/quarkus-media-file-manager/**'

      - name: Resolve which extensions to publish
        id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXT="${{ inputs.extension }}"
            for name in quarkus-base quarkus-authentication quarkus-authorization quarkus-microservices-common quarkus-error-mail-notification quarkus-media-file-manager; do
              if [ "$EXT" = "all" ] || [ "$EXT" = "$name" ]; then
                echo "${name}=true" >> "$GITHUB_OUTPUT"
              else
                echo "${name}=false" >> "$GITHUB_OUTPUT"
              fi
            done
          else
            echo "quarkus-base=${{ steps.changes.outputs.quarkus-base }}" >> "$GITHUB_OUTPUT"
            echo "quarkus-authentication=${{ steps.changes.outputs.quarkus-authentication }}" >> "$GITHUB_OUTPUT"
            echo "quarkus-authorization=${{ steps.changes.outputs.quarkus-authorization }}" >> "$GITHUB_OUTPUT"
            echo "quarkus-microservices-common=${{ steps.changes.outputs.quarkus-microservices-common }}" >> "$GITHUB_OUTPUT"
            echo "quarkus-error-mail-notification=${{ steps.changes.outputs.quarkus-error-mail-notification }}" >> "$GITHUB_OUTPUT"
            echo "quarkus-media-file-manager=${{ steps.changes.outputs.quarkus-media-file-manager }}" >> "$GITHUB_OUTPUT"
          fi

  publish-quarkus-base:
    needs: detect-changes
    if: needs.detect-changes.outputs.quarkus-base == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Check if version already published
        id: check_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          URL="https://maven.pkg.github.com/${{ github.repository }}/io/yanmastra/${ARTIFACT_ID}/${VERSION}/${ARTIFACT_ID}-${VERSION}.pom"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "$URL")
          if [ "$STATUS" = "200" ]; then
            echo "$ARTIFACT_ID:$VERSION is already published, skipping build/publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$ARTIFACT_ID:$VERSION not found (HTTP $STATUS), will publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: extensions/quarkus-base
      - name: Generate settings.xml
        if: steps.check_version.outputs.exists != 'true'
        run: |
          cat > $GITHUB_WORKSPACE/settings.xml << 'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
      - name: Build and publish
        if: steps.check_version.outputs.exists != 'true'
        run: mvn deploy -DskipTests -s $GITHUB_WORKSPACE/settings.xml
        working-directory: extensions/quarkus-base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        if: steps.check_version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="quarkus-base-v${{ steps.check_version.outputs.version }}"
          gh release create "$TAG" \
            --title "quarkus-base ${{ steps.check_version.outputs.version }}" \
            --notes "Published quarkus-base ${{ steps.check_version.outputs.version }} to GitHub Packages." \
            --latest \
            2>/dev/null || echo "Release $TAG already exists, skipping."

  publish-quarkus-authentication:
    needs: [detect-changes, publish-quarkus-base]
    if: |
      always() &&
      needs.detect-changes.outputs.quarkus-authentication == 'true' &&
      (needs.publish-quarkus-base.result == 'success' || needs.publish-quarkus-base.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
