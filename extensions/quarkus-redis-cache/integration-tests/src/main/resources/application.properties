# Redis connection. Left unset here on purpose: with no quarkus.redis.hosts, Quarkus Dev Services starts a
# throw-away Redis container automatically for `mvn test` (needs Docker, no infra/docker setup required).
#
# To point at a real Redis instead (e.g. infra/docker/docker-compose.yml's `redis` service), the actual
# connection string is in the "manual" profile below — run with:
#   mvn test -Dquarkus.test.profile=manual -DREDIS_PASSWORD=redis_local_password
cache.redis.key-prefix=kvcache-it

%manual.quarkus.redis.hosts=redis://:${REDIS_PASSWORD:redis_local_password}@localhost:6379

# fallback, the tests point this at a temporary directory
cache_directory=./target/cache

# JWT for the cookie-session tests
smallrye.jwt.sign.key.location=/privatekey-2.pem
mp.jwt.verify.publickey.location=/privatekey-2.pub
mp.jwt.verify.issuer=http://localhost:4000
security.jwt.token.encryption.secret=9EDF873DCE32473688CBD0E914DB5251
smallrye.jwt.sign.key.id=0EA194A1-BA38-4758-9250-BE9D1212E370
smallrye.jwt.expiration.grace=3600
security.jwt.isencrypt.accessToken=true
mp.jwt.verify.clock.skew=20
cookie.token.enabled=true
quarkus.log.category."io.yanmastra".level=DEBUG
